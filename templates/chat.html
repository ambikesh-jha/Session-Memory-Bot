<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            background-color: #ffffff;
        }
        .chat-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .chat-box {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            overflow-y: auto;
            height: 400px;
            display: flex;
            flex-direction: column;
        }
        .chat-message {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.4;
        }
        .chat-message.user {
            align-self: flex-end;
            background-color: #007bff;
            color: #fff;
        }
        .chat-message.bot {
            align-self: flex-start;
            background-color: #f1f0f0;
            color: #333;
        }
        .input-container {
            display: flex;
            padding: 10px;
            background-color: #f5f5f5;
            border-top: 1px solid #ddd;
        }
        .input-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }
        .input-container button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin-left: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .input-container button:disabled {
            background-color: #007bff88;
            cursor: not-allowed;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            color: #666;
        }
        .loading span {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin: 0 2px;
            background-color: #007bff;
            border-radius: 50%;
            animation: bounce 0.6s infinite alternate;
        }
        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes bounce {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-8px);
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-title">Chat-Bot</div>
        <div class="chat-box" id="chatBox">
        </div>
        <div class="loading" id="loading" style="display: none;">
            <span></span><span></span><span></span>
        </div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Type your message here..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    

    <script>
        async function sendMessage() {
            const userInput = document.getElementById("userInput").value.trim();
            if (!userInput) return;

            // Disable input and button while waiting for response
            document.querySelector("button").disabled = true;
            document.getElementById("loading").style.display = "flex";
            document.getElementById("userInput").value = "";

            // Display user message
            const chatBox = document.getElementById("chatBox");
            const userMessage = document.createElement("div");
            userMessage.className = "chat-message user";
            userMessage.textContent = userInput;
            chatBox.appendChild(userMessage);

            // Scroll to bottom
            chatBox.scrollTop = chatBox.scrollHeight;

            // Send request to server
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userInput })
            });
            const data = await response.json();

            // Hide loading animation
            document.getElementById("loading").style.display = "none";
            document.querySelector("button").disabled = false;   

            // Display bot response
            const botMessage = document.createElement("div");
            botMessage.className = "chat-message bot";
            botMessage.textContent = data.bot_response;
            chatBox.appendChild(botMessage);

            // Clear input field and scroll to bottom
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
